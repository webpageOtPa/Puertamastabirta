<?xml version="1.0" encoding="UTF-8"?>
<!-- coverage-map.svg — mapa geográfico simplificado de Colombia (PA-17D). -->
<!-- Contorno continental REAL: Natural Earth admin 0 1:50m (dominio -->
<!-- público), feature ADMIN=Colombia ADM0_A3=COL, solo continente -->
<!-- (Malpelo excluido), Douglas-Peucker tol 0.09° → 107 vértices. -->
<!-- Fuente exacta y SHA-256 en src/data/colombia-outline.json. Réplica -->
<!-- sincronizada del SVG inline de Cobertura.astro (mismo path, -->
<!-- sombreado zonal, puntos y etiquetas). La lista textual es la -->
<!-- fuente de verdad. Estático, no interactivo, sin red. -->
<!-- Zonas: Centro y Sur (bogota, ibague, cali); Eje Cafetero y -->
<!-- Antioquia (medellin, manizales, pereira); Norte y Caribe -->
<!-- (cartagena, barranquilla, santa-marta, monteria, sincelejo, -->
<!-- valledupar); Oriente (cucuta). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" role="img" aria-labelledby="coverage-map-title coverage-map-desc">
  <title id="coverage-map-title">Mapa geográfico simplificado de Colombia — 13 ciudades de referencia</title>
  <desc id="coverage-map-desc">Contorno Natural Earth (dominio público) de Colombia con 13 marcadores aproximados de ciudades. Los marcadores no indican oficinas. La lista textual del sitio es la fuente de verdad.</desc>
  <defs>
    <pattern id="cg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1D4ED8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect x="20" y="20" width="560" height="680" fill="#F4F6F9" stroke="#0D2C54" stroke-opacity="0.15"/>
  <rect x="20" y="20" width="560" height="680" fill="url(#cg)"/>

  <!-- Sombreado zonal por grupo (derivado en build de los puntos) -->
  <g fill="#1D4ED8" fill-opacity="0.08">
    <ellipse cx="214" cy="362" rx="76" ry="53"/>
    <ellipse cx="204" cy="309" rx="31" ry="57"/>
  </g>
    <ellipse cx="240" cy="142" rx="79" ry="77" fill="#F0E9F5"/>

  <!-- Contorno continental Natural Earth 1:50m simplificado (107 vértices) -->
  <path d="M360,71l-23,8-11,17-16,14-12,39-13,23 11,-3 10,6 5,18 10,12-3,29 17,18 47,-2 22,5 26,31 58,-6 14,4 1,9-13,25-1,28 7,24 13,17-21,23 9,0 15,15 12,38 1,5-8,1-1,-19-11,-15-19,13-10,-8 1,10-62,0 0,24 20,0 5,15-11,-3-22,6 0,26 16,14 8,25-21,113-13,-16-15,-1 24,-41-33,-17-16,5-13,-7-17,9-27,0-8,-5-1,-16-11,-5-6,-17-22,-10-20,-28-37,-11-18,-13-8,7-33,-5-12,-17-22,-8-27,-21 9,-8 8,3-1,-22 29,-13 27,-45-7,1 0,-6-3,4-2,-11-4,1 9,-19-4,-22-6,-8 11,-9-8,-15 4,-15-20,-24 5,-18 8,5 13,-15-11,-19 4,-6 22,27 1,-14-6,-10 24,-16 9,-14 15,-3 3,-28-6,2 10,-18 22,-18 19,4-7,5 4,3 10,-20 31,0 38,-22 5,-11 16,-9 16,3 5,11-5,5Z" fill="#FFFFFF" stroke="#0D2C54" stroke-width="2" stroke-linejoin="round"/>

  <!-- 13 puntos en posiciones aproximadas (data-city-id de COVERAGE_CITIES) -->
  <g fill="#FFFFFF" stroke="#0D2C54" stroke-width="1.6">
    <circle data-city-id="bogota" cx="259" cy="339" r="9"/>
    <circle data-city-id="ibague" cx="216" cy="349" r="7"/>
    <circle data-city-id="cali" cx="168" cy="385" r="7"/>
    <circle data-city-id="medellin" cx="203" cy="282" r="7"/>
    <circle data-city-id="manizales" cx="205" cy="325" r="7"/>
    <circle data-city-id="pereira" cx="205" cy="335" r="7"/>
    <circle data-city-id="cartagena" cx="206" cy="127" r="7"/>
    <circle data-city-id="barranquilla" cx="232" cy="105" r="7"/>
    <circle data-city-id="santa-marta" cx="253" cy="95" r="7"/>
    <circle data-city-id="monteria" cx="191" cy="188" r="7"/>
    <circle data-city-id="sincelejo" cx="209" cy="167" r="7"/>
    <circle data-city-id="valledupar" cx="289" cy="124" r="7"/>
    <circle data-city-id="cucuta" cx="316" cy="220" r="9"/>
  </g>

  <!-- Etiquetas de contexto natural -->
  <text x="224" y="43" font-size="10" fill="#4B5563">Mar Caribe</text>
  <text x="50" y="343" font-size="10" fill="#4B5563">Océano Pacífico</text>

  <!-- Marca de procedencia -->
  <text x="40" y="680" font-family="Manrope, sans-serif" font-size="11" fill="#4B5563">
    Natural Earth (dominio público) · posiciones aproximadas
  </text>
</svg>
